# Non-executable Media Directory Configuration
location /media/ {
    alias /app/media/;
    expires 30d;
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Disposition "attachment; filename=$1"; # For downloaded files
    
    # Block execution of any scripts or executable binaries in media directory
    location ~* \.(php|pl|py|jsp|asp|sh|cgi|exe|bat)$ {
        deny all;
        return 404;
    }
}
