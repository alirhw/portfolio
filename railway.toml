[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/scripts/docker-entrypoint.sh gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 30"
healthcheckPath = "/healthz/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
