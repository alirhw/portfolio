name: CI & Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Test Gate
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python Environment
        run: uv python install 3.14

      - name: Install Project Dependencies
        run: uv sync --frozen

      - name: Install Playwright Browsers & Dependencies
        run: uv run playwright install --with-deps chromium

      - name: Run Ruff Lint & Format Checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check Django Migrations Integrity
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django Production Deployment Check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: "ci-dummy-production-secret-key-for-checks-at-least-50-chars-long"
          ALLOWED_HOSTS: "ali.dev,localhost,127.0.0.1"
        run: uv run python manage.py check --deploy

      - name: Run Pytest Suite with Coverage Enforcement
        env:
          SECRET_KEY: "ci-testing-secret-key"
          GITHUB_ACCESS_TOKEN: ""
        run: uv run pytest tests/unit/ tests/functional/ tests/integration/ --cov=apps --cov=integrations --cov-report=term-missing --cov-fail-under=80

      - name: Run Playwright E2E Suite
        run: uv run pytest tests/e2e/ --no-cov

  docker-contract:
    name: Docker Image Build & Smoke Test
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image with BuildKit Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: portfolio-app:ci-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Docker Smoke Test
        run: |
          chmod +x scripts/docker_smoke_test.sh
          ./scripts/docker_smoke_test.sh portfolio-app:ci-test
