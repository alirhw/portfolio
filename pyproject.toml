[project]
name = "portfolio"
version = "0.1.0"
description = "Personal Developer Portfolio"
readme = "README.md"
authors = [
    { name = "alirhw", email = "ali.rouhani.2005@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "dj-database-url",
    "django>=6.1,<6.2",
    "httpx",
    "psycopg[binary]",
    "sentry-sdk",
    "whitenoise",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-django",
    "ruff",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short --cov=apps --cov=integrations --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["apps", "integrations"]
omit = [
    "*/migrations/*",
    "*/apps.py",
    "*/admin.py",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
