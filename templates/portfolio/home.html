{% extends "base.html" %}

{% block content %}
    <main>
        {% if profile %}
            <section>
                <h1>{{ profile }}</h1>
            </section>
        {% endif %}

        <section>
            {% for skill in skills %}
                <article>
                    {{ skill }}
                </article>
            {% endfor %}
        </section>

        <section>
            {% for project in projects %}
                <article>
                    <h2>{{ project }}</h2>

                    {% for technology in project.technologies.all %}
                        <span>{{ technology }}</span>
                    {% endfor %}
                </article>
            {% endfor %}
        </section>
    </main>
{% endblock %}
