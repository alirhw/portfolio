{% load i18n static %}

<section id="terminal-section" class="section terminal-wrapper js-only-feature">
    <!-- Full LTR isolation for terminal component in all languages -->
    <div
        class="terminal-window"
        id="portfolio-terminal"
        dir="ltr"
        lang="en"
        role="region"
        aria-label="Interactive Command Line Terminal"
    >
        <div class="terminal-header">
            <div class="terminal-controls" aria-hidden="true">
                <span class="ctrl-btn ctrl-close"></span>
                <span class="ctrl-btn ctrl-min"></span>
                <span class="ctrl-btn ctrl-max"></span>
            </div>
            <div class="terminal-title font-mono">ali@portfolio:~ (Interactive Shell)</div>
        </div>

        <div class="terminal-body">
            <div
                class="terminal-output-container font-mono"
                id="terminal-output"
                role="log"
                aria-live="polite"
            ></div>

            <div class="terminal-input-row">
                <label for="terminal-input" class="terminal-prompt font-mono" aria-hidden="true">
                    ali@portfolio:~$
                </label>
                <input
                    type="text"
                    id="terminal-input"
                    class="terminal-input font-mono"
                    dir="ltr"
                    lang="en"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    aria-label="Terminal Command Input"
                >
            </div>
        </div>
    </div>
</section>

{{ terminal_data|json_script:"terminal-data-source" }}

<script type="module" src="{% static 'js/terminal/controller.js' %}"></script>
