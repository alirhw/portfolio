{% load i18n static %}

<!-- Terminal component with progressive enhancement hidden state -->
<section id="terminal-section" class="section terminal-wrapper js-only-feature">
    <div class="terminal-window" id="portfolio-terminal">
        <div class="terminal-header">
            <div class="terminal-controls" aria-hidden="true">
                <span class="ctrl-btn ctrl-close"></span>
                <span class="ctrl-btn ctrl-min"></span>
                <span class="ctrl-btn ctrl-max"></span>
            </div>
            <div class="terminal-title font-mono">ali@portfolio:~ (Interactive Shell)</div>
        </div>

        <div class="terminal-body">
            <div class="terminal-output-container" id="terminal-output" role="log" aria-live="polite"></div>

            <div class="terminal-input-row">
                <label for="terminal-input" class="terminal-prompt font-mono">ali@portfolio:~$ </label>
                <input
                    type="text"
                    id="terminal-input"
                    class="terminal-input"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    aria-label="{% translate 'Terminal Command Input' %}"
                >
            </div>
        </div>
    </div>
</section>

<!-- Safe data injection via json_script without XSS vulnerability -->
{{ terminal_data|json_script:"terminal-data-source" }}

<script type="module" src="{% static 'js/terminal/controller.js' %}"></script>
