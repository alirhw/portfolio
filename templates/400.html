{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}" dir="{% if LANGUAGE_CODE == 'fa' %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - {% translate "Bad Request" %}</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent: #f85149;
            --link: #58a6ff;
            --code-bg: #161b22;
        }
        body {
            margin: 0;
            padding: 2rem;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .error-card {
            background: var(--code-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 2.5rem;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .error-code {
            font-size: 4rem;
            font-weight: 800;
            color: var(--accent);
            margin: 0;
            font-family: monospace;
        }
        .error-msg {
            margin: 1rem 0 2rem;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-block;
            background: var(--link);
            color: #0d1117;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <h1 class="error-code">400</h1>
        <h2>{% translate "Bad Request" %}</h2>
        <p class="error-msg">{% translate "The server could not understand your request." %}</p>
        <a href="/" class="btn-home">{% translate "Return Home" %}</a>
    </div>
</body>
</html>
